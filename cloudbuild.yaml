substitutions:
  _REGION: europe-west3
  _REPOSITORY: wohnungsplaner
  _SERVICE: wohnungsplaner

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s

steps:
  - id: plan-deployment
    name: node:24-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        mkdir -p /workspace/Wohnungsplaner_Generated/reports/cloudbuild
        node scripts/cloudbuild-plan.mjs "${COMMIT_SHA}" /workspace/deploy-plan.json
        cp /workspace/deploy-plan.json /workspace/Wohnungsplaner_Generated/reports/cloudbuild/plan.json

  - id: build-image
    waitFor: [plan-deployment]
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        mode=$(sed -n 's/.*"mode"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /workspace/deploy-plan.json)
        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}"
        tag="${COMMIT_SHA:-manual-${BUILD_ID}}"
        if [ "$mode" = "skip" ]; then
          echo "No production deployment required"
          exit 0
        fi
        if [ "$mode" = "asset-live" ]; then
          echo "Live asset publication runs in its dedicated step"
          exit 0
        fi
        if [ "$mode" = "runtime" ] && docker pull "$image:latest"; then
          docker build --file Dockerfile.runtime --build-arg "BASE_IMAGE=$image:latest" \
            --tag "$image:$tag" --tag "$image:latest" .
        elif [ "$mode" = "assets" ] && docker pull "$image:latest"; then
          docker build --file Dockerfile.assets --build-arg "BASE_IMAGE=$image:latest" \
            --tag "$image:$tag" --tag "$image:latest" .
        else
          docker build --file Dockerfile --tag "$image:$tag" --tag "$image:latest" .
        fi
        docker push "$image:$tag"
        docker push "$image:latest"

  - id: validate-assets
    waitFor: [plan-deployment]
    name: node:24-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        mode=$(sed -n 's/.*"mode"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /workspace/deploy-plan.json)
        if [ "$mode" = "asset-live" ]; then
          node scripts/check-planner-assets.mjs
        elif [ "$mode" = "full" ]; then
          npm run assets:check
        else
          echo "Asset validation skipped"
        fi

  - id: publish-live-assets
    waitFor: [validate-assets]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    entrypoint: bash
    args:
      - -ceu
      - |
        mode=$(sed -n 's/.*"mode"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /workspace/deploy-plan.json)
        if [ "$mode" != "asset-live" ]; then
          echo "Live asset publication skipped"
          exit 0
        fi
        project_number=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
        export PLANNER_LIVE_ASSET_BUCKET="${PROJECT_ID}-wohnungsplaner-assets"
        export PLANNER_LIVE_ASSET_SIGNER="${project_number}-compute@developer.gserviceaccount.com"
        export PLANNER_LIVE_ASSET_RELEASE="${COMMIT_SHA:-manual-${BUILD_ID}}"
        sdk_root=$(gcloud info --format='value(installation.sdk_root)')
        "$sdk_root/platform/bundledpythonunix/bin/python3" scripts/publish-live-assets.py

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        mode=$(sed -n 's/.*"mode"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /workspace/deploy-plan.json)
        if [ "$mode" = "skip" ] || [ "$mode" = "asset-live" ]; then
          echo "Deployment skipped"
          exit 0
        fi
        tag="${COMMIT_SHA:-manual-${BUILD_ID}}"
        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:$tag"
        gcloud run deploy "${_SERVICE}" \
          --image "$image" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --cpu 1 \
          --memory 1Gi \
          --concurrency 40 \
          --min 0 \
          --max 2 \
          --cpu-boost \
          --set-env-vars HOST=0.0.0.0,PLANNER_PIN_REQUIRED=1,PLANNER_LIVE_ASSET_MANIFEST_URL=https://storage.googleapis.com/${PROJECT_ID}-wohnungsplaner-assets/current.json \
          --set-secrets PLANNER_ACCESS_PIN=PLANNER_ACCESS_PIN:latest,PLANNER_COOKIE_KEY=PLANNER_COOKIE_KEY:latest
