timeout: 900s
options:
  machineType: E2_STANDARD_2
  logging: CLOUD_LOGGING_ONLY
  automapSubstitutions: true
substitutions:
  _REGION: europe-west1
  _SERVICE: wohnungsplaner-preview
  _IMAGE_NAME: wohnungsplaner
  _REGISTRY: wohnungsplaner
  _RUNTIME_ACCOUNT: wohnungsplaner-runtime
  _CONNECTION: wohnungsplaner-github
  _REPOSITORY: wohnungsplaner
  _DEPLOY: 'true'
steps:
  - id: fast-build
    name: node:22.22.2-bookworm
    env: ['CI=true']
    entrypoint: bash
    args:
      - -euc
      - |
        npx --yes npm@12.1.0 ci --ignore-scripts --no-audit --no-fund
        npm run build

  - id: image-build
    name: gcr.io/cloud-builders/docker
    args: ['build', '--platform', 'linux/amd64', '--tag', 'europe-west1-docker.pkg.dev/$PROJECT_ID/wohnungsplaner/wohnungsplaner:$COMMIT_SHA-$BUILD_ID', '.']

  - id: image-push
    name: gcr.io/cloud-builders/docker
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/wohnungsplaner/wohnungsplaner:$COMMIT_SHA-$BUILD_ID']

  - id: preview-deploy
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'COMMIT_SHA=$COMMIT_SHA'
      - 'BUILD_ID=$BUILD_ID'
      - 'BRANCH_NAME=$BRANCH_NAME'
      - '_REGION=${_REGION}'
      - '_SERVICE=${_SERVICE}'
      - '_IMAGE_NAME=${_IMAGE_NAME}'
      - '_REGISTRY=${_REGISTRY}'
      - '_RUNTIME_ACCOUNT=${_RUNTIME_ACCOUNT}'
      - '_CONNECTION=${_CONNECTION}'
      - '_REPOSITORY=${_REPOSITORY}'
      - '_DEPLOY=${_DEPLOY}'
    entrypoint: bash
    args:
      - -euc
      - |
        bash scripts/cloud-run-preview-deploy.sh
