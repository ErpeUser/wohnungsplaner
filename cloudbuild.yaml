timeout: 2700s
options:
  machineType: E2_STANDARD_2
  logging: CLOUD_LOGGING_ONLY
  automapSubstitutions: true
substitutions:
  _REGION: europe-west1
  _SERVICE: wohnungsplaner-preview
  _IMAGE_NAME: wohnungsplaner
  _REGISTRY: wohnungsplaner
  _RUNTIME_ACCOUNT: wohnungsplaner-runtime
  _CONNECTION: wohnungsplaner-github
  _REPOSITORY: wohnungsplaner
  _DEPLOY: 'true'
  _CACHE_BUCKET: wohnungsplaner-build-cache-EXAMPLE
steps:
  - id: cache-restore
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    env: ['_CACHE_BUCKET=${_CACHE_BUCKET}']
    entrypoint: bash
    args: ['scripts/cloud-preview-cache.sh', 'restore']

  - id: preview-build
    name: node:22.22.2-bookworm-slim
    env: ['CI=true']
    entrypoint: bash
    args: ['scripts/cloud-preview-cache.sh', 'build']

  - id: cache-save
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    waitFor: ['preview-build']
    env: ['_CACHE_BUCKET=${_CACHE_BUCKET}']
    entrypoint: bash
    args: ['scripts/cloud-preview-cache.sh', 'save']

  - id: image-build
    name: gcr.io/cloud-builders/docker
    waitFor: ['preview-build']
    env: ['_DEPLOY=${_DEPLOY}']
    entrypoint: bash
    args:
      - -euc
      - |
        if [[ "$${_DEPLOY:?Missing deploy flag}" == true ]]; then
          docker build --platform linux/amd64 --tag '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REGISTRY}/${_IMAGE_NAME}:$COMMIT_SHA-$BUILD_ID' .
        fi

  - id: image-push
    name: gcr.io/cloud-builders/docker
    waitFor: ['image-build']
    env: ['_DEPLOY=${_DEPLOY}']
    entrypoint: bash
    args:
      - -euc
      - |
        if [[ "$${_DEPLOY:?Missing deploy flag}" == true ]]; then
          docker push '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REGISTRY}/${_IMAGE_NAME}:$COMMIT_SHA-$BUILD_ID'
        fi

  - id: preview-deploy
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    waitFor: ['image-push']
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'COMMIT_SHA=$COMMIT_SHA'
      - 'BUILD_ID=$BUILD_ID'
      - 'BRANCH_NAME=$BRANCH_NAME'
      - '_REGION=${_REGION}'
      - '_SERVICE=${_SERVICE}'
      - '_IMAGE_NAME=${_IMAGE_NAME}'
      - '_REGISTRY=${_REGISTRY}'
      - '_RUNTIME_ACCOUNT=${_RUNTIME_ACCOUNT}'
      - '_CONNECTION=${_CONNECTION}'
      - '_REPOSITORY=${_REPOSITORY}'
      - '_DEPLOY=${_DEPLOY}'
    entrypoint: bash
    args:
      - -euc
      - |
        bash scripts/cloud-run-preview-deploy.sh
