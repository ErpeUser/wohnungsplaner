name: Visual Cloud Evidence
on:
  push:
    branches: ['main', 'qa/github-only-visual-*']
  workflow_dispatch:
    inputs:
      scope:
        description: Tests to run
        type: choice
        options: [all, gui, models]
        default: all

permissions:
  contents: read

concurrency:
  group: visual-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: 'true'
      VISUAL_BROWSER_CHANNEL: chrome
      LIBGL_ALWAYS_SOFTWARE: '1'
      VISUAL_SKIP_BUILD: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify preinstalled browser
        run: |
          command -v google-chrome
          google-chrome --version
          git rev-parse HEAD
      - name: Install dependencies
        run: npx --yes npm@12.1.0 ci --ignore-scripts --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Check private media
        run: node scripts/check-private-references.mjs --build
      - name: Cloud screenshots and GUI tests
        env:
          VISUAL_COMMIT: ${{ github.sha }}
          VISUAL_BRANCH: ${{ github.ref_name }}
          SCOPE: ${{ github.event.inputs.scope || 'all' }}
        run: |
          case "$SCOPE" in
            gui) npm run test:browser ;;
            models) npm run visual:models ;;
            all) npm run visual:check ;;
            *) exit 2 ;;
          esac
      - name: Store private evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-cloud-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/visual/latest/
          if-no-files-found: warn
          retention-days: 30
