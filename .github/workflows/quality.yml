name: Quality

on:
  workflow_dispatch:
    inputs:
      full_gallery:
        description: Capture every model from four angles
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install locked dependencies
        run: npx --yes npm@12.1.0 ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Planner tests
        run: npm run test:planner

      - name: UI tests
        run: npm run test:ui -- --maxWorkers=1

      - name: Cutover and server smoke tests
        run: npm run test:cutover

      - name: Asset manifest validation
        run: npm run assets:check

      - name: Reference export validation
        run: npm run reference:check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and visual regression tests
        env:
          VISUAL_SKIP_BUILD: "1"
          FULL_GALLERY: ${{ inputs.full_gallery }}
        run: |
          if [[ "$FULL_GALLERY" == "true" ]]; then
            npm run visual:check
          else
            npm run test:browser
          fi

      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-${{ github.sha }}
          path: artifacts/visual/latest/
          if-no-files-found: warn
          retention-days: 7

      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high --json

      - name: Build verified production container
        run: docker build --platform linux/amd64 --tag "wohnungsplaner:${GITHUB_SHA}" .

      - name: Smoke test production container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name planner-smoke --publish 127.0.0.1:8080:8080 "wohnungsplaner:${GITHUB_SHA}"
          trap 'docker logs planner-smoke; docker rm --force planner-smoke' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/ --output /tmp/planner.html
          grep --quiet 'Raumplaner' /tmp/planner.html
          curl --fail http://127.0.0.1:8080/planner-assets/textures/wood/oak.svg --output /dev/null
          docker exec planner-smoke sh -c 'test -z "$(find /app -type f \( -path "*/private-reference/*" -o -path "*/planner-assets/reference/*" \) -print -quit)"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/planner-assets/reference/wohnungsplan.png)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/dev/models)" = 404
