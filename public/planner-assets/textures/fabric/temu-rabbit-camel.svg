<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="fur" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.075 0.16" numOctaves="3" seed="18" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7f6047" flood-opacity="0.34"/>
    </filter>
    <linearGradient id="pile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ead5bd"/>
      <stop offset="0.46" stop-color="#cfaf90"/>
      <stop offset="1" stop-color="#ac896b"/>
    </linearGradient>
    <pattern id="bubbles" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#c5a586"/>
      <rect x="7" y="7" width="50" height="50" rx="17" fill="url(#pile)" filter="url(#softShadow)"/>
      <path d="M16 20c12-9 25-9 36 0" fill="none" stroke="#f2dfca" stroke-width="3" stroke-linecap="round" opacity=".52"/>
      <path d="M17 46c12 7 24 7 34 0" fill="none" stroke="#89684f" stroke-width="2" stroke-linecap="round" opacity=".23"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="url(#bubbles)" filter="url(#fur)"/>
  <rect x="3" y="3" width="250" height="250" rx="18" fill="none" stroke="#efd9c0" stroke-width="6" opacity=".6"/>
</svg>
